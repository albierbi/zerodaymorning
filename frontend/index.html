<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zero-Day Morning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #242424;
    --accent: #e8ff47;
    --accent2: #ff4747;
    --text: #e8e8e0;
    --muted: #6a6a60;
    --mono: 'JetBrains Mono', monospace;
    --serif: 'Playfair Display', serif;
    --sans: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.6;
  }

  .masthead {
    border-bottom: 1px solid var(--border);
    padding: 0 clamp(20px, 5vw, 80px);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 20px;
    min-height: 80px;
    width: 100%;
    box-sizing: border-box;
  }

@media (max-width: 600px) {
  .masthead {
    grid-template-columns: 1fr auto;
    padding: 0 20px;
  }
  .masthead-right { display: none; }
  .brief-title { font-size: clamp(28px, 8vw, 48px); }
  .article { padding: 24px 0; }
  .sidebar { padding: 24px 0 0; }
  .brief-meta { gap: 12px; }
  .layout { padding: 0 20px; }
  .hero { padding: 32px 20px 0; }
  .footer { padding: 20px; }
}

  .masthead-left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .masthead-logo {
    text-align: center;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 8px 16px;
    white-space: nowrap;
  }

  .masthead-right {
    text-align: right;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .hero {
    padding: clamp(40px, 8vh, 80px) clamp(20px, 5vw, 80px) 0;
    border-bottom: 1px solid var(--border);
    max-width: 100%;
  }

  .hero-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .hero-eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
    max-width: 80px;
  }

  .brief-title {
    font-family: var(--serif);
    font-size: clamp(36px, 6vw, 80px);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin-bottom: 32px;
    max-width: 900px;
  }

  .brief-title em {
    font-style: italic;
    color: var(--accent);
  }

  .brief-meta {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 20px 0;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .tag {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid;
  }

  .tag-category { border-color: var(--accent); color: var(--accent); }
  .tag-difficulty { border-color: var(--muted); color: var(--muted); }
  .tag-time { border-color: var(--border); color: var(--muted); }

  .layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 0;
    padding: 0 clamp(20px, 5vw, 80px);
    max-width: 1400px;
    margin: 0 auto;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { border-left: none; border-top: 1px solid var(--border); padding: 32px 0 0; }
  }

  .article {
    padding: 48px 48px 48px 0;
    border-right: 1px solid var(--border);
  }

  @media (max-width: 900px) {
    .article { border-right: none; padding: 32px 0; }
  }

  .article-body { font-size: 17px; line-height: 1.8; color: #d0d0c8; font-weight: 300; }
  .article-body h2 { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--text); margin: 40px 0 16px; line-height: 1.2; }
  .article-body h3 { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; margin: 32px 0 12px; }
  .article-body p { margin-bottom: 20px; }
  .article-body strong { color: var(--text); font-weight: 500; }
  .article-body ul { margin: 0 0 20px 20px; }
  .article-body li { margin-bottom: 8px; }
  .article-body code { font-family: var(--mono); font-size: 13px; background: var(--surface2); padding: 2px 6px; color: var(--accent); }

  .callout {
    border-left: 3px solid var(--accent);
    padding: 20px 24px;
    background: rgba(232, 255, 71, 0.04);
    margin: 32px 0;
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }

  .callout-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .code-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 24px;
  }

  .code-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 20px 24px;
    margin-bottom: 24px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    color: #b0c4b8;
    overflow-x: auto;
    white-space: pre;
  }

  .tldr {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px;
    margin-top: 48px;
  }

  .tldr-header {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tldr-header::before { content: '//'; }

  .tldr ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }

  .tldr li {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    padding-left: 20px;
    position: relative;
  }

  .tldr li::before { content: '→'; position: absolute; left: 0; color: var(--accent); }

  .sidebar { padding: 48px 0 48px 32px; display: flex; flex-direction: column; gap: 32px; }

  .sidebar-block { border-bottom: 1px solid var(--border); padding-bottom: 28px; }
  .sidebar-block:last-child { border-bottom: none; }

  .sidebar-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .vocab-item { margin-bottom: 16px; }
  .vocab-term { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .vocab-def { font-size: 13px; line-height: 1.5; color: var(--muted); }

  .resource-link {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    transition: color 0.2s;
  }

  .resource-link:hover { color: var(--accent); }
  .resource-link:last-child { border-bottom: none; }

  .difficulty-bar { height: 4px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .difficulty-fill { height: 100%; background: var(--accent); transition: width 1s ease; }

  .loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    gap: 24px;
    text-align: center;
  }

  .loading-animation { display: flex; gap: 6px; align-items: center; }

  .loading-bar {
    width: 3px;
    height: 24px;
    background: var(--accent);
    animation: bars 1.2s ease-in-out infinite;
  }

  .loading-bar:nth-child(2) { animation-delay: 0.15s; height: 36px; }
  .loading-bar:nth-child(3) { animation-delay: 0.3s; height: 18px; }
  .loading-bar:nth-child(4) { animation-delay: 0.45s; height: 30px; }
  .loading-bar:nth-child(5) { animation-delay: 0.6s; height: 22px; }

  @keyframes bars {
    0%, 100% { opacity: 0.2; transform: scaleY(0.5); }
    50% { opacity: 1; transform: scaleY(1); }
  }

  .loading-text { font-family: var(--mono); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }

  .error-state { text-align: center; padding: 80px 20px; font-family: var(--mono); font-size: 13px; color: var(--accent2); }

  .footer {
    border-top: 1px solid var(--border);
    padding: 20px clamp(20px, 5vw, 80px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .footer-left { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
  .footer-right { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in { animation: fadeIn 0.5s ease forwards; }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-left">
    <div class="status-dot"></div>
    <span id="live-date"></span>
  </div>
  <div class="masthead-logo">Zero-Day Morning</div>
<div class="masthead-right">
    <a href="/archive.html" style="font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:0.05em;transition:color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">Archive →</a>
  </div>
</header>

<div class="hero">
  <div class="hero-eyebrow">Today's Brief</div>
  <h1 class="brief-title" id="main-title">Loading<em>...</em></h1>
  <div class="brief-meta">
    <span class="tag tag-category" id="tag-cat">—</span>
    <span class="tag tag-difficulty" id="tag-diff">—</span>
    <span class="tag tag-time">~20 min read</span>
  </div>
</div>

<div class="layout">
  <div class="article">
    <div id="content-area">
      <div class="loading-state">
        <div class="loading-animation">
          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
        </div>
        <div class="loading-text">Loading today's brief...</div>
      </div>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-block">
      <div class="sidebar-label">Key terms</div>
      <div id="vocab-items"><div style="font-family:var(--mono);font-size:12px;color:var(--muted)">Loading...</div></div>
    </div>

    <div class="sidebar-block">
      <div class="sidebar-label">Difficulty</div>
      <div style="font-family:var(--mono);font-size:13px;color:var(--text)" id="diff-label">—</div>
      <div class="difficulty-bar"><div class="difficulty-fill" id="diff-bar" style="width:0%"></div></div>
    </div>

    <div class="sidebar-block">
      <div class="sidebar-label">Go deeper</div>
      <div id="sidebar-links"><div style="font-family:var(--mono);font-size:12px;color:var(--muted)">Loading...</div></div>
    </div>

    <div class="sidebar-block">
      <div class="sidebar-label">Published</div>
      <div id="generated-at" style="font-family:var(--mono);font-size:12px;color:var(--muted)">—</div>
    </div>
  </aside>
</div>

<footer class="footer">
  <span class="footer-left">Zero-Day Morning — A new brief every day</span>
  <span class="footer-right" id="footer-date"></span>
</footer>

<script>
  function setDate() {
    const now = new Date();
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const str = `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
    document.getElementById('live-date').textContent = str;
    document.getElementById('footer-date').textContent = str;
  }

  async function loadBrief() {
    try {
      const res = await fetch('/api/brief');
      if (!res.ok) throw new Error('not ready');
      const brief = await res.json();
      renderBrief(brief);
    } catch (err) {
      document.getElementById('main-title').innerHTML = 'No brief yet<em>.</em>';
      document.getElementById('content-area').innerHTML = `
        <div class="error-state">
          Today's brief hasn't been generated yet. Check back soon.
        </div>`;
    }
  }

  function renderBrief(brief) {
    const titleWords = brief.title.split(' ');
    const last = titleWords.pop();
    document.getElementById('main-title').innerHTML =
      titleWords.join(' ') + ' <em>' + last + '</em>';

    document.getElementById('tag-cat').textContent = brief.category;
    document.getElementById('tag-diff').textContent = brief.difficulty;
    document.getElementById('diff-label').textContent = brief.difficulty;

    setTimeout(() => {
      document.getElementById('diff-bar').style.width = brief.difficultyPercent + '%';
    }, 100);

    if (brief.generatedAt) {
      const d = new Date(brief.generatedAt);
      document.getElementById('generated-at').textContent =
        d.toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
    }

    document.getElementById('vocab-items').innerHTML =
      brief.vocab.map(v => `
        <div class="vocab-item">
          <div class="vocab-term">${v.term}</div>
          <div class="vocab-def">${v.def}</div>
        </div>`).join('');

    document.getElementById('sidebar-links').innerHTML =
      brief.resources.map(r =>
        `<a class="resource-link" href="${r.url}" target="_blank" rel="noopener">${r.label} ↗</a>`
      ).join('');

    document.getElementById('content-area').innerHTML = `
      <div class="article-body fade-in">
        <p style="font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:32px;font-style:italic">${brief.subtitle}</p>
        ${brief.body}
        <div class="tldr">
          <div class="tldr-header">TL;DR</div>
          <ul>${brief.tldr.map(t => `<li>${t}</li>`).join('')}</ul>
        </div>
      </div>`;
  }
async function loadBriefByDate(date) {
    try {
      const res = await fetch(`/api/brief-by-date?date=${date}`);
      if (!res.ok) throw new Error('not found');
      const brief = await res.json();
      document.querySelector('.hero-eyebrow').textContent = `Brief from ${date}`;
      renderBrief(brief);
    } catch (err) {
      document.getElementById('main-title').innerHTML = 'Brief not <em>found.</em>';
      document.getElementById('content-area').innerHTML = `
        <div class="error-state">No brief found for ${date}. <a href="/" style="color:var(--accent)">Go to today's brief →</a></div>`;
    }
  }

setDate();
  const urlDate = new URLSearchParams(window.location.search).get('date');
  if (urlDate) {
    loadBriefByDate(urlDate);
  } else {
    loadBrief();
  }
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
